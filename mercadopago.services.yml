services:
  # Specific channel for loggers.
  logger.channel.mercadopago:
    parent: logger.channel_base
    arguments:
      - 'mercadopago'

  mercadopago.api:
    class: Drupal\mercadopago\Service\MercadoPagoApiService
    arguments:
